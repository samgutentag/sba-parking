name = "sba-parking"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
# Only for process.env, so config.ts reads [vars] the same way it reads env vars on the Pi.
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# The path pattern also matches /sba-parking itself, which the Worker redirects to /sba-parking/.
routes = [{ pattern = "around805.com/sba-parking*", zone_name = "around805.com" }]

# Static files in public/ are served by the Worker itself (run_worker_first) so it can strip
# BASE_PATH and stamp asset hashes into index.html before falling through to ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sba-parking"
database_id = "14bb8114-b4aa-4434-9fdf-abbd707b0261"

# Parking every 5 minutes, flights every 15. Must match PARKING_CRON / FLIGHTS_CRON in worker.ts.
[triggers]
crons = ["*/5 * * * *", "*/15 * * * *"]

[vars]
BASE_PATH = "/sba-parking"
