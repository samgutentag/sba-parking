<!doctype html>
<!-- Source for the home-screen icons. Full-bleed square: iOS and Android cut their own shape,
     and the P stays inside the center 80% that a maskable icon is allowed to crop to. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #2a78d6; }
  body { display: grid; place-items: center; }
  span { color: #fff; font: 700 288px/1 system-ui, -apple-system, sans-serif; transform: translateY(2%); }
</style></head><body><span>P</span></body></html>
