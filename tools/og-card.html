<!doctype html>
<!-- Source for public/og.png, the link-preview card (1200x630). No live numbers on purpose:
     the image is cached by every app that unfurls the link, so counts would be wrong forever. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f9f9f7; color: #0b0b0b; font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 88px; box-sizing: border-box;
  }
  .mark { width: 112px; height: 112px; border-radius: 26px; background: #2a78d6; color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 72px; margin-bottom: 44px; }
  h1 { font-size: 84px; margin: 0; letter-spacing: -0.02em; }
  p { font-size: 33px; line-height: 1.3; color: #3d3c37; margin: 18px 0 0; max-width: 1040px; }
  .lots { display: flex; gap: 14px; margin-top: 40px; }
  .lots span { font-size: 26px; padding: 8px 18px; border-radius: 999px; border: 2px solid rgba(11,11,11,.12); background: #fcfcfb; }
  .url { position: absolute; right: 88px; bottom: 56px; font-size: 26px; color: #6b6a63; }
</style></head><body>
  <div class="mark">P</div>
  <h1>SBA Parking</h1>
  <p>Live open spaces at Santa Barbara Airport, updated every 5 minutes.</p>
  <div class="lots"><span>Short-term</span><span>Long-term</span><span>Economy</span></div>
  <div class="url">around805.com/sba-parking</div>
</body></html>
